name: Notify course platform

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  notify-course-platform:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send minimal signed repository event
        env:
          WEBHOOK_URL: ${{ secrets.COURSE_REPOSITORY_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.COURSE_REPOSITORY_WEBHOOK_SECRET }}
        shell: bash
        run: |
          set -euo pipefail

          : "${WEBHOOK_URL:?COURSE_REPOSITORY_WEBHOOK_URL is not configured}"
          : "${WEBHOOK_SECRET:?COURSE_REPOSITORY_WEBHOOK_SECRET is not configured}"
          : "${GITHUB_EVENT_PATH:?GitHub event payload is unavailable}"

          delivery_id="$({
            printf '%s' "${GITHUB_REPOSITORY}:${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}:${GITHUB_SHA}"
          } | sha256sum | cut -d' ' -f1)"

          payload_file="$(mktemp)"
          response_body="$(mktemp)"
          trap 'rm -f "${payload_file}" "${response_body}"' EXIT

          # The platform pulls whatever it needs from the repository itself,
          # so only identifiers are sent: forwarding the full push event
          # exceeds the 8 KiB WAF body limit. Keep the body under 2 KiB.
          payload_size="$({
            PAYLOAD_FILE="${payload_file}" python3 - <<'PY'
          import json
          import os

          with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as event_file:
              event = json.load(event_file)
          repository = event.get("repository") or {}
          minimal = {
              "repository": {"full_name": repository.get("full_name", "")},
              "ref": event.get("ref", ""),
              "before": event.get("before", ""),
              "after": event.get("after", ""),
              "deleted": event.get("deleted", False),
          }
          if not minimal["ref"] or not minimal["after"]:
              raise SystemExit("push event is missing ref/after; nothing to notify")
          body = json.dumps(minimal, separators=(",", ":")).encode("utf-8")
          if len(body) >= 2048:
              raise SystemExit(f"minimal payload too large: {len(body)} bytes")
          with open(os.environ["PAYLOAD_FILE"], "wb") as payload_file:
              payload_file.write(body)
          print(len(body))
          PY
          })"
          echo "Webhook payload size: ${payload_size} bytes."

          signature="$({
            PAYLOAD_FILE="${payload_file}" python3 - <<'PY'
          import hashlib
          import hmac
          import os

          with open(os.environ["PAYLOAD_FILE"], "rb") as payload_file:
              payload = payload_file.read()
          secret = os.environ["WEBHOOK_SECRET"].encode("utf-8")
          print(hmac.new(secret, payload, hashlib.sha256).hexdigest())
          PY
          })"

          if ! http_code="$(curl \
              --retry 4 \
              --retry-all-errors \
              --retry-delay 2 \
              --retry-max-time 90 \
              --connect-timeout 10 \
              --max-time 60 \
              --show-error \
              --request POST \
              --header 'Content-Type: application/json' \
              --header 'X-GitHub-Event: push' \
              --header "X-GitHub-Delivery: ${delivery_id}" \
              --header "X-Hub-Signature-256: sha256=${signature}" \
              --data-binary "@${payload_file}" \
              --output "${response_body}" \
              --write-out '%{http_code}' \
              "${WEBHOOK_URL}")"; then
            echo "Course-platform webhook request failed (curl error)." >&2
            echo "HTTP status: ${http_code:-unknown}" >&2
            echo "Response body (first 2000 bytes):" >&2
            head -c 2000 "${response_body}" >&2 || true
            echo "" >&2
            exit 1
          fi

          echo "HTTP status: ${http_code}"
          echo "Response body (first 2000 bytes):"
          head -c 2000 "${response_body}" || true
          echo ""

          case "${http_code}" in
            2??)
              echo "Course-platform webhook accepted (HTTP ${http_code})."
              ;;
            *)
              echo "Course-platform webhook returned non-2xx status HTTP ${http_code}." >&2
              exit 1
              ;;
          esac
