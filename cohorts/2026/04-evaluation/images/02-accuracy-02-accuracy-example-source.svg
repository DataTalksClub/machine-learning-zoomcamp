<svg xmlns="http://www.w3.org/2000/svg" width="902" height="680" viewBox="0 0 902 680" role="img" aria-labelledby="title description">
  <title id="title">Accuracy example with six predictions</title>
  <desc id="description">Six customer predictions have scores 0.2, 0.3, 0.4, 0.45, 0.55 and 0.7. Three predictions are correct, giving 3 out of 6, or 50 percent, at threshold t greater than 0.5.</desc>
  <defs>
    <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#d51f2a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,4 L0,8" fill="none" stroke="#2027af" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .marker { font-family: Loma, 'DejaVu Sans', sans-serif; font-weight: 400; }
      .blue { fill: #2027af; stroke: #2027af; }
      .red { fill: #d51f2a; stroke: #d51f2a; }
      .green { fill: none; stroke: #159447; }
      .black-line { fill: none; stroke: #161616; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .group-line { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="902" height="680" fill="#ffffdd"/>

  <text class="marker blue" x="34" y="54" font-size="37" letter-spacing="1">4.2 ACCURACY</text>

  <!-- The source frame groups scores below the threshold in blue and scores above it in red. -->
  <path class="group-line blue" d="M116 104 C120 83 138 76 166 76 L550 78 C576 79 589 91 590 116 L592 302 C591 326 579 339 552 340 L150 338 C122 336 111 322 112 296 Z"/>
  <path class="group-line red" d="M607 82 C604 102 604 122 605 151 L602 299 C603 321 615 334 638 334 L764 334 C780 332 789 321 788 300 L786 104 C785 89 776 82 761 82 Z"/>
  <path class="group-line red" d="M780 82 C779 105 780 126 780 154 L779 300 C781 322 795 334 818 334 L875 334 C890 332 897 321 895 300 L893 105 C892 89 884 82 869 82 Z"/>
  <path class="red group-line" d="M605 16 C604 94 603 181 604 261 C604 318 596 369 603 418"/>

  <!-- Six source-faithful stick figures. -->
  <g class="black-line">
    <ellipse cx="170" cy="157" rx="27" ry="31"/>
    <path d="M170 188 L169 247 M169 204 L139 231 M169 204 L198 226 M169 247 L145 286 M169 247 L195 286"/>
    <ellipse cx="300" cy="157" rx="27" ry="31"/>
    <path d="M300 188 L299 247 M299 204 L269 231 M299 204 L328 226 M299 247 L275 286 M299 247 L325 286"/>
    <ellipse cx="430" cy="157" rx="27" ry="31"/>
    <path d="M430 188 L429 247 M429 204 L399 231 M429 204 L458 226 M429 247 L405 286 M429 247 L455 286"/>
    <ellipse cx="560" cy="157" rx="27" ry="31"/>
    <path d="M560 188 L559 247 M559 204 L529 231 M559 204 L588 226 M559 247 L535 286 M559 247 L585 286"/>
    <ellipse cx="690" cy="157" rx="27" ry="31"/>
    <path d="M690 188 L689 247 M689 204 L659 231 M689 204 L718 226 M689 247 L665 286 M689 247 L715 286"/>
    <ellipse cx="820" cy="157" rx="27" ry="31"/>
    <path d="M820 188 L819 247 M819 204 L789 231 M819 204 L848 226 M819 247 L795 286 M819 247 L845 286"/>
  </g>

  <!-- Correct / incorrect decisions from the frame. -->
  <g fill="none" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M153 105 L166 119 L190 91" stroke="#159447"/>
    <path d="M282 95 L315 124 M315 95 L282 124" stroke="#d51f2a"/>
    <path d="M412 95 L445 124 M445 95 L412 124" stroke="#d51f2a"/>
    <path d="M542 105 L555 119 L579 91" stroke="#159447"/>
    <path d="M672 95 L705 124 M705 95 L672 124" stroke="#d51f2a"/>
    <path d="M802 105 L815 119 L839 91" stroke="#159447"/>
  </g>

  <g class="marker red" font-size="26">
    <text x="133" y="320">0.2</text>
    <text x="263" y="320">0.3</text>
    <text x="393" y="320">0.4</text>
    <text x="521" y="320">0.45</text>
    <text x="672" y="320">0.55</text>
    <text x="803" y="320">0.7</text>
  </g>

  <text class="marker blue" x="143" y="470" font-size="40">3/6 = 50%</text>
  <path d="M296 442 C296 418 296 391 296 354" fill="none" stroke="#d51f2a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-red)"/>
  <path d="M427 442 C427 418 427 391 427 354" fill="none" stroke="#d51f2a" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-red)"/>

  <text class="marker red" x="622" y="500" font-size="36">t &gt; 0.5</text>
  <path d="M691 473 C691 440 691 402 691 349" fill="none" stroke="#2027af" stroke-width="3.5" stroke-linecap="round" marker-end="url(#arrow-blue)"/>
</svg>
