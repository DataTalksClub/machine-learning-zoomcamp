    <line x1="650" y1="870" x2="650" y2="882"/><line x1="910" y1="870" x2="910" y2="882"/>
    <line x1="1170" y1="870" x2="1170" y2="882"/><line x1="1430" y1="870" x2="1430" y2="882"/>
    <line x1="118" y1="732" x2="130" y2="732"/><line x1="118" y1="599" x2="130" y2="599"/>
    <line x1="118" y1="465" x2="130" y2="465"/><line x1="118" y1="332" x2="130" y2="332"/>
    <line x1="118" y1="199" x2="130" y2="199"/><line x1="118" y1="66" x2="130" y2="66"/>
  </g>
  <g font-size="32" text-anchor="middle">
    <text x="130" y="925">0.0</text><text x="390" y="925">0.2</text>
    <text x="650" y="925">0.4</text><text x="910" y="925">0.6</text>
    <text x="1170" y="925">0.8</text><text x="1430" y="925">1.0</text>
  </g>
  <g font-size="32" text-anchor="end">
