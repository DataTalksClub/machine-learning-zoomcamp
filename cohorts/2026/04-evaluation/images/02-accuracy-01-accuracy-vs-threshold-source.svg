<svg xmlns="http://www.w3.org/2000/svg" width="1488" height="992" viewBox="0 0 1488 992" role="img" aria-labelledby="title description">
  <title id="title">Accuracy of the model at different decision thresholds</title>
  <desc id="description">A deterministic plot of the 21 accuracy values printed in 02-accuracy.md, for thresholds from 0.00 to 1.00 in steps of 0.05. The maximum is 0.803 at threshold 0.50.</desc>
  <style>
    text { font-family: DejaVu Sans, sans-serif; fill: #222; }
    .axis { stroke: #222; stroke-width: 3; }
    .tick { stroke: #222; stroke-width: 2; }
    .curve { fill: none; stroke: #1f77b4; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
  </style>
  <!--
    Source data copied from 02-accuracy.md, lines 58-79:
    thresholds = 0.00, 0.05, ..., 1.00
    accuracy  = 0.274, 0.509, 0.591, 0.666, 0.710, 0.739, 0.760,
                0.772, 0.785, 0.793, 0.803, 0.801, 0.795, 0.786,
                0.766, 0.744, 0.735, 0.726, 0.726, 0.726, 0.726
    Plot transform: x = 130 + 1300 * threshold;
                    y = 870 - (accuracy - 0.2) * 830 / 0.62.
  -->
  <rect width="1488" height="992" fill="#fff"/>
  <line class="axis" x1="130" y1="40" x2="130" y2="870"/>
  <line class="axis" x1="130" y1="870" x2="1430" y2="870"/>

  <g class="tick">
    <line x1="130" y1="870" x2="130" y2="882"/><line x1="390" y1="870" x2="390" y2="882"/>
    <line x1="650" y1="870" x2="650" y2="882"/><line x1="910" y1="870" x2="910" y2="882"/>
    <line x1="1170" y1="870" x2="1170" y2="882"/><line x1="1430" y1="870" x2="1430" y2="882"/>
    <line x1="118" y1="736.13" x2="130" y2="736.13"/><line x1="118" y1="602.26" x2="130" y2="602.26"/>
    <line x1="118" y1="468.39" x2="130" y2="468.39"/><line x1="118" y1="334.52" x2="130" y2="334.52"/>
    <line x1="118" y1="200.65" x2="130" y2="200.65"/><line x1="118" y1="66.77" x2="130" y2="66.77"/>
  </g>
  <g font-size="32" text-anchor="middle">
    <text x="130" y="925">0.0</text><text x="390" y="925">0.2</text>
    <text x="650" y="925">0.4</text><text x="910" y="925">0.6</text>
    <text x="1170" y="925">0.8</text><text x="1430" y="925">1.0</text>
  </g>
  <g font-size="32" text-anchor="end">
    <text x="105" y="743">0.3</text><text x="105" y="610">0.4</text>
    <text x="105" y="476">0.5</text><text x="105" y="343">0.6</text>
    <text x="105" y="210">0.7</text><text x="105" y="77">0.8</text>
  </g>
  <path class="curve" data-thresholds="0.00 0.05 0.10 0.15 0.20 0.25 0.30 0.35 0.40 0.45 0.50 0.55 0.60 0.65 0.70 0.75 0.80 0.85 0.90 0.95 1.00" data-accuracy="0.274 0.509 0.591 0.666 0.710 0.739 0.760 0.772 0.785 0.793 0.803 0.801 0.795 0.786 0.766 0.744 0.735 0.726 0.726 0.726 0.726" d="M130 770.94 L195 456.34 L260 346.56 L325 246.16 L390 187.26 L455 148.44 L520 120.32 L585 104.26 L650 86.85 L715 76.15 L780 62.76 L845 65.44 L910 73.47 L975 85.52 L1040 112.29 L1105 141.74 L1170 153.79 L1235 165.84 L1300 165.84 L1365 165.84 L1430 165.84"/>
</svg>
